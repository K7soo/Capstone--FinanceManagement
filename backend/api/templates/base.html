{% load static %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Sidebar CSS -->
		<link rel="stylesheet" href="{% static 'css/sidebar.css' %}" />

		<!-- Bootstrap CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
		<!-- Bootstrap Icons -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
		<link rel="stylesheet" href="{% static 'css/bootstrap-icons/bootstrap-icons.css' %}">
		<!-- Unicons -->
		<link href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" rel="stylesheet" />

		<!-- Font Awesome -->
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
		<link rel="stylesheet" href="{% static 'css/fontawesome/all.min.css' %}">
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet" />

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
		<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
		<!-- swal -->
		<link rel="stylesheet" href="{% static 'css/sweetalert/sweetalert2.min.css' %}">
		<!-- <link rel="icon" type="image/svg+xml" href="{% static 'images/tikme-icon2.png' %}"> -->
		<link
		rel="icon"
		sizes="192x192"
		href="https://static.wixstatic.com/media/967817_089802794d9a48e59cbefaaa7986aa66%7Emv2.png/v1
		/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/967817_089802794d9a48e59cbefaaa7986aa66%7Emv2.png"
		type="image/png" />

		<!-- Additional Project CSS -->
		{% block extra_css %}
		<link rel="stylesheet" href="{% static 'css/base.css' %}" />
		{% endblock %}

		<title>{% block title %}Finance Management{% endblock %}</title>
	</head>

	<body>
		<div class="container">{% include 'Global/sidebar.html' %}</div>
		<!-- Include the reusable sidebar -->

		<!-- Main content block -->
		<div class="main-content">
			{% block content %}
			<!-- Default content goes here -->
			{% endblock %}
		</div>

		<!-- Sidebar JS -->
		<script src="{% static 'js/sidebar.js' %}"></script>

		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script src="{% static 'js/bootstrap/bootstrap.bundle.min.js' %}"></script>
		<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

		<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
		<script src="{% static 'js/jquery/jquery.min.js' %}"></script>

		<script src="{% static 'js/chartjs/chart.umd.js' %}"></script>
		<script src="{% static 'js/chartjs/chart.umd.min.js' %}"></script>
		<!-- swal -->
		<script src="{% static 'js/sweetalert/sweetalert2.min.js' %}"></script>
		<!-- Additional Project JS -->
		{% block extra_js %}
		<script src="{% static 'js/base.js' %}"></script>
		{% endblock %}
	</body>
</html>
