{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="{% static 'js/Reports/reports.js' %}"></script>
<script>
    function createYearPicker(input) {
        const startYear = 2020;
        const currentYear = new Date().getFullYear();
        
        return flatpickr(input, {
            disableMobile: true,
            dateFormat: "Y",
            defaultDate: new Date(),
            
            onOpen: function(selectedDates, dateStr, instance) {
                const calendar = instance.calendarContainer;
                calendar.classList.add('yearCalendar');
                
                // Clear existing content
                const daysContainer = calendar.querySelector('.flatpickr-days');
                if (daysContainer) daysContainer.style.display = 'none';
                
                // Create year grid if it doesn't exist
                let yearGrid = calendar.querySelector('.yearGrid');
                if (!yearGrid) {
                    yearGrid = document.createElement('div');
                    yearGrid.className = 'yearGrid';
                    calendar.appendChild(yearGrid);
                }
                
                // Clear and populate year grid
                yearGrid.innerHTML = '';
                for (let year = startYear; year <= currentYear; year++) {
                    const yearCell = document.createElement('div');
                    yearCell.className = 'yearCell';
                    if (year === parseInt(dateStr)) {
                        yearCell.classList.add('selected');
                    }
                    yearCell.textContent = year;
                    yearCell.addEventListener('click', () => {
                        instance.setDate(new Date(year, 0, 1));
                        instance.close();
                    });
                    yearGrid.appendChild(yearCell);
                }
            }
        });
    }

    // Initialize year pickers
    document.querySelectorAll('#year-filter').forEach(input => {
        createYearPicker(input);
    });
</script>
{% endblock %}
