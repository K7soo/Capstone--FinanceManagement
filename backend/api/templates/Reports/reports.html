<!-- prettier-ignore -->
{% extends 'base.html' %} 

{% load static %} 

{% block title %} 
Reports
{% endblock %} 

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/global/global.css' %}" />
<style>
	.nav-tabs .nav-link.active {
		color: #6f42c1; /* Bootstrap primary color */
		border-color: #6f42c1 #6f42c1 #fff;
		background-color: #fff; /* Tab background color */
	}
	.nav-tabs .nav-link {
		color: black; /* Default text color */
	}
	.tab-content {
		padding: 0; /* Remove padding */
		margin: 0; /* Remove margin */
	}
	.card.p-3 {
		margin-bottom: 0; /* Align the card content tightly */
	}
</style>
{% endblock %}

<!-- prettier-ignore -->
{% block content %}
<div class="container mt-5">
	<!-- Breadcrumb -->
	<!-- <ol class="breadcrumb mt-2 mb-1">
		<li class="breadcrumb-item d-flex align-items-center">
			<span class="text-muted">Reports</span>
		</li>
	</ol> -->
	<h1 class="text" style="color: #6f42c1">Reports</h1>
	<p>Generate Financial Reports</p>

	<!-- Card Container -->
	<div class="card shadow-sm mb-4 p-4">
		<!--begin::Reports Tabs-->
		<ul class="nav nav-tabs" id="reportTabs" role="tablist">
			<!--begin::General Journal Tab-->
			<li class="nav-item" role="presentation">
				<button
					class="nav-link active"
					id="general-journal-tab"
					data-bs-toggle="tab"
					data-bs-target="#general-journal"
					type="button"
					role="tab"
					aria-controls="general-journal"
					aria-selected="true">
					General Journal
				</button>
			</li>
			<!--end::General Journal Tab-->

			<!--begin::General Ledger Tab-->
			<li class="nav-item" role="presentation">
				<button
					class="nav-link"
					id="general-ledger-tab"
					data-bs-toggle="tab"
					data-bs-target="#general-ledger"
					type="button"
					role="tab"
					aria-controls="general-ledger"
					aria-selected="false">
					General Ledger
				</button>
			</li>
			<!--end::General Ledger Tab-->

			<!--begin::Cash Flow Tab-->
			<li class="nav-item" role="presentation">
				<button
					class="nav-link"
					id="trial-balance-tab"
					data-bs-toggle="tab"
					data-bs-target="#trial-balance"
					type="button"
					role="tab"
					aria-controls="trial-balance"
					aria-selected="false">
					Trial Balance
				</button>
			</li>
			<!--end::Cash Flow Tab-->

			<!--begin::Income vs Expense Tab-->
			<li class="nav-item" role="presentation">
				<button
					class="nav-link"
					id="income-expense-tab"
					data-bs-toggle="tab"
					data-bs-target="#income-expense"
					type="button"
					role="tab"
					aria-controls="income-expense"
					aria-selected="false">
					Income vs Expense
				</button>
			</li>
			<!--end::Income vs Expense Tab-->

			<!--begin::Balance Sheet Tab-->
			<li class="nav-item" role="presentation">
				<button
					class="nav-link"
					id="balance-sheet-tab"
					data-bs-toggle="tab"
					data-bs-target="#balance-sheet"
					type="button"
					role="tab"
					aria-controls="balance-sheet"
					aria-selected="false">
					Balance Sheet
				</button>
			</li>
			<!--end::Balance Sheet Tab-->
		</ul>
		<!--end::Reports Tabs-->

		<!--begin: Tab Contents -->
		<div class="tab-content mt-3" id="reportTabsContent">
			<!--begin: General Journal Tab-->
			<div class="tab-pane fade show active" id="general-journal" role="tabpanel" aria-labelledby="general-journal-tab">
				<!--begin: Card-->
				<div class="card p-3 shadow-sm">
					<div class="row g-3">
						<!-- Transaction -->
						<div class="col-md-4">
							<label for="transaction-type" class="form-label">Transaction</label>
							<select id="transaction-type" class="form-select">
								<option value="">Transaction Type</option>
								<!-- Add transaction types dynamically -->
							</select>
						</div>
						<!-- As of -->
						<div class="col-md-6">
							<label for="as-of" class="form-label">As of</label>
							<input type="date" id="as-of" class="form-control" />
						</div>
						<!-- Duration -->
						<div class="col-md-6">
							<label for="duration-from" class="form-label">Duration</label>
							<div class="d-flex gap-2">
								<input type="date" id="duration-from" class="form-control" />
								<span class="align-self-center">to</span>
								<input type="date" id="duration-to" class="form-control" />
							</div>
						</div>
					</div>

					<!-- Buttons -->
					<div class="d-flex gap-3 mt-3">
						<button
							class="btn btn-success"
							style="
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							data-bs-toggle="modal"
							data-bs-target="#">
							<i class="bi bi-file-earmark-spreadsheet me-2"></i>
							Export
						</button>
						<button
							class="btn btn-primary"
							style="
								background-color: #6f42c1;
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							onmouseover="this.style.backgroundColor='#5a3795';"
							onmouseout="this.style.backgroundColor='#6f42c1';"
							data-bs-toggle="modal"
							data-bs-target="#">
							<!-- style="border-radius: 8px; font-weight: 600; font-size: 0.875rem; padding: 0.5rem 1rem; -->
							<i class="bi bi-printer me-2"></i>
							Print
						</button>
					</div>
				</div>
				<!--end: Card-->
			</div>
			<!--end: General Journal Tab-->

			<!--begin: General Ledger Tab-->
			<div class="tab-pane fade" id="general-ledger" role="tabpanel" aria-labelledby="general-ledger-tab">
				<!--begin: Card-->
				<div class="card p-3 shadow-sm">
					<div class="row g-3">
						<!-- Ledger Account -->
						<div class="col-md-4">
							<label for="ledger-account" class="form-label">Ledger Account</label>
							<select id="ledger-account" class="form-select">
								<option value="">Select Ledger Account</option>
								<!-- Add ledger accounts dynamically -->
							</select>
						</div>
						<!-- As of -->
						<div class="col-md-4">
							<label for="as-of-ledger" class="form-label">As of</label>
							<input type="date" id="as-of-ledger" class="form-control" />
						</div>
						<!-- Duration -->
						<div class="col-md-6">
							<label for="duration-from-ledger" class="form-label">Duration</label>
							<div class="d-flex gap-2">
								<input type="date" id="duration-from-ledger" class="form-control" />
								<span class="align-self-center">to</span>
								<input type="date" id="duration-to-ledger" class="form-control" />
							</div>
						</div>
					</div>

					<!-- Buttons -->
					<div class="d-flex gap-3 mt-3">
						<button
							class="btn btn-success"
							style="
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							data-bs-toggle="modal"
							data-bs-target="#">
							<i class="bi bi-file-earmark-spreadsheet me-2"></i>
							Export
						</button>
						<button id="print-ledger"
							class="btn btn-primary"
							style="
								background-color: #6f42c1;
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							onmouseover="this.style.backgroundColor='#5a3795';"
							onmouseout="this.style.backgroundColor='#6f42c1';"
							data-bs-toggle="modal"
							data-bs-target="#">
							<!-- style="border-radius: 8px; font-weight: 600; font-size: 0.875rem; padding: 0.5rem 1rem; -->
							<i class="bi bi-printer me-2"></i>
							Print
						</button>
					</div>
				</div>
				<!--end: Card-->
			</div>
			<!--end: General Ledger Tab-->

			<!--begin: Cash Flow Tab-->
			<div class="tab-pane fade" id="trial-balance" role="tabpanel" aria-labelledby="trial-balance-tab">
				<!--begin: Card-->
				<div class="card p-3 shadow-sm">
					<!--begin: Row-->
					<div class="row g-3">
						<!--begin: As of Date-->
						<div class="col-md-4">
							<label for="as-of-tb" class="form-label">As of</label>
							<input type="date" id="as-of-tb" class="form-control" />
						</div>
						<!--end: As of Date-->

						<!--begin: Duration-->
						<div class="col-md-4">
							<label for="duration-from-tb" class="form-label">Duration</label>
							<div class="d-flex gap-2">
								<input type="date" id="duration-from-tb" class="form-control" />
								<span class="align-self-center">to</span>
								<input type="date" id="duration-to-tb" class="form-control" />
							</div>
						</div>
						<!--end: Duration-->
					</div>
					<!--end: Row-->

					<!-- Begin: Buttons -->
					<div class="d-flex gap-3 mt-3">
						<button
							class="btn btn-success"
							style="
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							data-bs-toggle="modal"
							data-bs-target="#">
							<i class="bi bi-file-earmark-spreadsheet me-2"></i>
							Export
						</button>
						<button
							class="btn btn-primary"
							style="
								background-color: #6f42c1;
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							onmouseover="this.style.backgroundColor='#5a3795';"
							onmouseout="this.style.backgroundColor='#6f42c1';"
							data-bs-toggle="modal"
							data-bs-target="#">
							<!-- style="border-radius: 8px; font-weight: 600; font-size: 0.875rem; padding: 0.5rem 1rem; -->
							<i class="bi bi-printer me-2"></i>
							Print
						</button>
					</div>
					<!-- End: Buttons-->
				</div>
				<!--end: Card-->
			</div>
			<!--end: Cash Flow Tab-->

			<!--begin: Income vs Expense Tab-->
			<div class="tab-pane fade" id="income-expense" role="tabpanel" aria-labelledby="income-expense-tab">
				<!--begin: Card-->
				<div class="card p-3 shadow-sm">
					<!--begin: Row-->
					<div class="row g-3">
						<!--begin: As of Date-->
						<div class="col-md-4">
							<label for="as-of-income-expense" class="form-label">As of</label>
							<input type="date" id="as-of-income-expense" class="form-control" />
						</div>
						<!--end: As of Date-->

						<!--begin: Duration-->
						<div class="col-md-4">
							<label for="duration-from-income-expense" class="form-label">Duration</label>
							<div class="d-flex gap-2">
								<input type="date" id="duration-from-income-expense" class="form-control" />
								<span class="align-self-center">to</span>
								<input type="date" id="duration-to-income-expense" class="form-control" />
							</div>
						</div>
						<!--end: Duration-->
					</div>
					<!--end: Row-->

					<!--begin: Buttons-->
					<div class="d-flex gap-3 mt-3">
						<button
							class="btn btn-success"
							style="
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							data-bs-toggle="modal"
							data-bs-target="#">
							<i class="bi bi-file-earmark-spreadsheet me-2"></i>
							Export
						</button>
						<button
							class="btn btn-primary"
							style="
								background-color: #6f42c1;
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							onmouseover="this.style.backgroundColor='#5a3795';"
							onmouseout="this.style.backgroundColor='#6f42c1';"
							data-bs-toggle="modal"
							data-bs-target="#">
							<!-- style="border-radius: 8px; font-weight: 600; font-size: 0.875rem; padding: 0.5rem 1rem; -->
							<i class="bi bi-printer me-2"></i>
							Print
						</button>
					</div>
					<!--end: Buttons-->
				</div>
				<!--end: Card-->
			</div>
			<!--end: Income vs Expense Tab-->

			<!--begin: Balance Sheet Tab-->
			<div class="tab-pane fade" id="balance-sheet" role="tabpanel" aria-labelledby="balance-sheet-tab">
				<!--begin: Card-->
				<div class="card p-3 shadow-sm">
					<!--begin: Row-->
					<div class="row g-3">
						<!--begin: As of Date-->
						<div class="col-md-4">
							<label for="as-of-balance-sheet" class="form-label">As of</label>
							<input type="date" id="as-of-balance-sheet" class="form-control" />
						</div>
						<!--end: As of Date-->

						<!--begin: Duration-->
						<div class="col-md-4">
							<label for="duration-from-balance-sheet" class="form-label">Duration</label>
							<div class="d-flex gap-2">
								<input type="date" id="duration-from-balance-sheet" class="form-control" />
								<span class="align-self-center">to</span>
								<input type="date" id="duration-to-balance-sheet" class="form-control" />
							</div>
						</div>
						<!--end: Duration-->
					</div>
					<!--end: Row-->

					<!--begin: Buttons-->
					<div class="d-flex gap-3 mt-3">
						<button
							class="btn btn-success"
							style="
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							data-bs-toggle="modal"
							data-bs-target="#">
							<i class="bi bi-file-earmark-spreadsheet me-2"></i>
							Export
						</button>
						<button
							class="btn btn-primary"
							style="
								background-color: #6f42c1;
								color: white;
								border: none;
								border-radius: 8px;
								font-weight: 500;
								padding: 0.5rem 1rem 0.5rem 1rem;
								transition: background-color 0.3s ease, color 0.3s ease;
							"
							onmouseover="this.style.backgroundColor='#5a3795';"
							onmouseout="this.style.backgroundColor='#6f42c1';"
							data-bs-toggle="modal"
							data-bs-target="#">
							<!-- style="border-radius: 8px; font-weight: 600; font-size: 0.875rem; padding: 0.5rem 1rem; -->
							<i class="bi bi-printer me-2"></i>
							Print
						</button>
					</div>
					<!--end: Buttons-->
				</div>
				<!--end: Card-->
			</div>
			<!--end: Balance Sheet Tab-->

			<!--end: Tab Contents -->
		</div>
	</div>
</div>
{% endblock %}

<!-- prettier-ignore -->
{% block extra_js %}
<script src="{% static 'js/Reports/reports.js' %}"></script>
{% endblock %}
